<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;background:#0b121b;font-family:"Barlow Semi Condensed",sans-serif;color:#e9eff6;overflow:hidden;position:relative}
canvas{position:absolute;inset:0}
.t{position:absolute;left:80px;top:150px}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:150px;line-height:.9;margin:0}
h1 span:nth-child(1){color:#ff5d73}h1 span:nth-child(2){color:#ffd23f}h1 span:nth-child(3){color:#3ddc97}h1 span:nth-child(4){color:#4cc9f0}h1 span:nth-child(5){color:#b48cff}h1 span:nth-child(6){color:#ff8c42}
p{font-size:42px;margin:22px 0 0;font-weight:600;max-width:820px;line-height:1.15}
.b{display:inline-block;margin-top:28px;background:#ffb547;color:#1a1205;font-family:Bungee,sans-serif;font-size:30px;padding:14px 28px;border-radius:14px}
</style></head><body><canvas id="c" width="1200" height="630"></canvas>
<div class="t"><h1><span>V</span><span>I</span><span>J</span><span>U</span><span>G</span><span>A</span></h1><p>Zmije, skokovi i power-upovi. Igraj s prijateljima u pregledniku i na mobitelu.</p><span class="b">Besplatno · 500 zlatnika</span></div>
<script>
const c=document.getElementById('c').getContext('2d');c.lineCap='round';c.lineWidth=9;
const cols=['#ff5d73','#ffd23f','#3ddc97','#4cc9f0','#b48cff','#ff8c42'];
let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
cols.forEach((col,i)=>{let x=980+r()*160,y=50+i*100,a=r()*6.28;c.strokeStyle=col;c.globalAlpha=.85;c.beginPath();c.moveTo(x,y);for(let s=0;s<160;s++){a+=Math.sin(s/9+i)*.09;x+=Math.cos(a)*3.2;y+=Math.sin(a)*3.2;if(x<900){a=Math.PI-a;x=900}if(x>1180){a=Math.PI-a;x=1180}if(s%55>48){c.stroke();c.beginPath();c.moveTo(x,y);continue}c.lineTo(x,y)}c.stroke();c.globalAlpha=1;c.fillStyle=col;c.beginPath();c.arc(x,y,9,0,7);c.fill()});
</script></body></html>
